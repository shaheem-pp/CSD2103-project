<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Signup</title>

	<script src="https://code.jquery.com/jquery-3.7.1.js"
		integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
	<link rel="stylesheet" href="../css/bootstrap.css">
	<link rel="stylesheet" href="../css/style.css">
</head>

<body>
	<div class="container">
		<div class="center-hv">
			<div class="card shadow">
				<div class="card-body p-5">
					<h1 class="text-center mb-5">Signup</h1>
					<form action="">
						<!-- name -->
						<div class="mb-3">
							<label for="name" class="form-label">Name</label>
							<input type="text" class="form-control" id="name" aria-describedby="nameField" required>
						</div>
						<!-- username -->
						<div class="mb-3">
							<label for="email" class="form-label">Email</label>
							<input type="email" class="form-control" id="email" aria-describedby="emailField" required>
						</div>
						<!-- password -->
						<div class="mb-3">
							<label for="password" class="form-label">Password</label>
							<input type="password" class="form-control" id="password" aria-describedby="passwordField"
								required>
							<div class="mb-3 form-check">
								<input type="checkbox" class="form-check-input" id="showPassword">
								<label class="form-check-label" for="showPassword">Show Password</label>
							</div>
							<div id="passwordValidation" class="mt-2">
								<p id="length" class="password-rule"><span class="text-danger">× Minimum 6
										characters</span></p>
								<p id="capital" class="password-rule"><span class="text-danger">× At least 1 uppercase
										letter</span></p>
								<p id="lowercase" class="password-rule"><span class="text-danger">× At least 1 lowercase
										letter</span></p>
								<p id="number" class="password-rule"><span class="text-danger">× At least 1
										number</span></p>
								<p id="special" class="password-rule"><span class="text-danger">× At least 1 special
										character</span></p>
							</div>
						</div>

						<button id="submitBtn" type="submit" class="btn btn-primary w-100 mt-3">Submit</button>
					</form>
					<p>Do you have an account? <a href="login.html">Login</a></p>
				</div>
			</div>
		</div>
	</div>

	<script src="../js/script.js"></script>
	<script src="../js/bootstrap.js"></script>
	<script src="../js/custom/signup.js"></script>
</body>

</html>
