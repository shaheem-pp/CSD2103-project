<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Product Detail</title>

	<script src="https://code.jquery.com/jquery-3.7.1.js"
		integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
	<script src="https://kit.fontawesome.com/33fa90f288.js" crossorigin="anonymous"></script>

	<link rel="stylesheet" href="../css/bootstrap.css">
	<link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-light bg-gradient">

	<nav class="navbar navbar-expand-lg bg-body-tertiary">
		<div class="container-fluid">
			<a class="navbar-brand" href="#">
				<img src="../images/logo.jpg" style="height: 5rem; width: 5rem; object-fit: fill;" alt=""> Urban Nest
			</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse"
				data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
				aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarSupportedContent">
				<ul class="navbar-nav ms-auto mb-2 mb-lg-0">
					<li class="nav-item">
						<a class="nav-link" aria-current="page" href="index.html">
							<i class="fa-solid fa-house"></i> Home
						</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" aria-current="page" href="user.html">
							<i class="fa-solid fa-user"></i> User
						</a>
					</li>
				</ul>
			</div>
		</div>
	</nav>

	<div class="m-5">
		<div class="row">
			<div id="product-image-div" class="col col-12 col-md-6 p-2">
				<img id="product-image" src="" alt="Product Image">
			</div>
			<div class="col col-12 col-md-6 p-2">
				<h1 id="product-title"></h1>
				<h5 id="product-price"></h5>
				<p id="product-category" class="text-muted m-0 p-0"></p>
				<p id="available-colors"></p>
				<p id="product-description" style="text-align: justify;"></p>
				<div id="available-sizes" class="d-flex flex-wrap my-1"></div>								
				<div class="input-group">
					<button class="btn btn-outline-secondary" type="button" id="decrement">-</button>
					<input type="number" class="form-control" id="quantity" value="1" min="0" max="5" readonly
						class="text-center">
					<button class="btn btn-outline-secondary" type="button" id="increment">+</button>
				</div>
				<p class="text-muted d-flex ms-auto" id="inStock" style="font-size: .8rem;justify-content: flex-end;">
				</p>
				<br>
				<button class="btn w-100 btn-primary bg-gradient"><i class="fa-solid fa-lock"></i>&nbsp;Place
					Order</button>



			</div>
		</div>
	</div>

	<script src="../js/script.js"></script>
	<script src="../js/bootstrap.js"></script>
	<script src="../js/custom/product-detail.js"></script>
</body>

</html>
